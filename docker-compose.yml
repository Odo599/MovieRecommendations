services:
    postgres:
        container_name: drizzle-postgres
        environment:
            - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            - POSTGRES_USER=$POSTGRES_USERNAME
        volumes:
            - drizzle-postgres-data:/var/lib/postgresql/data
        image: postgres:17
    migrate:
        build:
            context: ./
            dockerfile: ./backend/migrate.Dockerfile
        env_file:
            ./.env
        depends_on:
            - postgres
        command: npm --workspace backend run dev
    backend:
        build:
            context: ./
            dockerfile: ./backend/Dockerfile
        depends_on:
            - postgres
            - migrate
        env_file:
            ./.env
    frontend:
        build:
            context: ./
            dockerfile: ./frontend/Dockerfile
        ports: 8080:3000
    redis:
        container_name: cache-redis
        image: redis:7.4-alpine
        restart: unless-stopped
        command: redis-server --requirepass $REDIS_PASSWORD --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

volumes:
    drizzle-postgres-data:
