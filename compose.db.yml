services:
    postgres:
        container_name: drizzle-postgres
        environment:
            - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            - POSTGRES_USER=$POSTGRES_USERNAME
        volumes:
            - drizzle-postgres-data:/var/lib/postgresql/data
        image: postgres:17
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USERNAME -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
    redis:
        container_name: cache-redis
        image: redis:7.4-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 3

volumes:
    drizzle-postgres-data:
